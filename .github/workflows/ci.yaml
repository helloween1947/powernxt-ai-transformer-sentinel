name: Backend CI

on:
  push:
    branches: [main, chore/team-repository-setup, 'feature/persond-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinel:ci_test_only@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            analytics/contracts/requirements-test.txt
      - name: Install backend and merged contract dependencies
        run: pip install -r backend/requirements-dev.txt -r analytics/contracts/requirements-test.txt
      - name: Run backend and merged contract tests
        run: python -m pytest backend/tests analytics/contracts -v

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify independent D sample mapper
        working-directory: .
        run: node --test integration/frontend/maintenanceAdapter.test.mjs
