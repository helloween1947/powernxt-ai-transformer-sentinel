# Third override after compose.yaml and compose.analytics-test.yaml.
# Only an explicitly named isolated verification project may use this file.
services:
  db:
    ports: !override
      - "127.0.0.1:${BACKEND_TEST_DB_PORT:?Select a free isolated database port}:5432"
  backend:
    image: ${COMPOSE_PROJECT_NAME:?Set isolated project}-backend:completion
    environment:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?Use an isolated test password}@db:5432/worker_integration_test
  worker:
    image: ${COMPOSE_PROJECT_NAME:?Set isolated project}-worker:completion
    environment:
      ENVIRONMENT: test
