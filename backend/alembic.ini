# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts relative to alembic.ini location
script_location = %(here)s/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with backend folder
prepend_sys_path = .

# Timezone for generated revisions
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Database URL is overridden programmatically in env.py from backend.app.config.settings
sqlalchemy.url = postgresql+psycopg://sentinel:sentinel_dev_pw@localhost:5432/sentinel_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
